name: container-test

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "HTTPS URL of the submitted package repo"
        required: true
      submission_id:
        description: "Pantry submission ID"
        required: true
      callback_url:
        description: "URL to POST the test result to"
        required: true
      nonce:
        description: "Per-submission nonce mixed into the callback HMAC"
        required: true
      is_bundle:
        description: "true if the package is a multi-component bundle"
        required: false
        default: "false"
      lockfile_content:
        description: "Pre-resolved pip lockfile (output of pip-compile or equivalent)"
        required: false
        default: ""
      sdk_ref:
        description: "Ref of jarvis-command-sdk to install (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  test:
    # Runs submitted code (clone + harness inside docker sandbox).
    # MUST NOT have access to the callback signing key — that key lives in
    # the `pantry-callback` environment, gated to the `callback` job below.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Checkout submission repo
        run: |
          git clone --depth 1 "${{ github.event.inputs.repo_url }}" submission

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-stage sandbox image and deps
        env:
          SDK_REF: ${{ github.event.inputs.sdk_ref }}
          LOCKFILE_CONTENT: ${{ github.event.inputs.lockfile_content }}
        run: |
          docker pull python:3.11-slim
          docker volume create harness-deps
          mkdir -p stage
          printf '%s' "$LOCKFILE_CONTENT" > stage/submission-lockfile.txt
          docker run --rm \
            -v harness-deps:/deps \
            -v "$GITHUB_WORKSPACE/stage:/stage:ro" \
            -e SDK_REF="$SDK_REF" \
            python:3.11-slim \
            sh -c '
              set -e
              # python:3.11-slim has no git; pip needs it for git+https URLs.
              # Installed only in this throwaway pre-stage container — the
              # sandbox container below stays slim-untouched.
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends git
              pip install --no-cache-dir --target=/deps pyyaml requests "git+https://github.com/alexberardi/jarvis-command-sdk.git@${SDK_REF}"
              if [ -s /stage/submission-lockfile.txt ]; then
                pip install --no-cache-dir --target=/deps -r /stage/submission-lockfile.txt \
                  --only-binary=:all: --no-build-isolation
              fi
            '

      - name: Run harness in sandbox
        id: harness
        continue-on-error: true
        run: |
          mkdir -p output
          set +e
          docker run --rm \
            --network=none \
            --read-only \
            --memory=128m \
            --tmpfs /tmp:rw,size=64m \
            -v "$GITHUB_WORKSPACE/runner:/runner:ro" \
            -v "$GITHUB_WORKSPACE/submission:/submission:ro" \
            -v harness-deps:/deps:ro \
            -v "$GITHUB_WORKSPACE/output:/output:rw" \
            -e PYTHONPATH=/deps \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e JARVIS_HARNESS_REPO_DIR=/submission \
            -e JARVIS_HARNESS_COMMAND_DIR=/submission \
            -e JARVIS_HARNESS_TEST_DIR=/output \
            python:3.11-slim \
            sh -c 'python /runner/harness.py > /output/harness_output.json 2> /output/harness_stderr.log'
          exit_code=$?
          set -e
          cp output/harness_output.json harness_output.json 2>/dev/null || echo '{}' > harness_output.json
          cp output/harness_stderr.log harness_stderr.log 2>/dev/null || : > harness_stderr.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Show harness output
        if: always()
        run: |
          echo "=== harness_output.json ==="
          cat harness_output.json || true
          echo ""
          echo "=== harness_stderr.log ==="
          cat harness_stderr.log || true

      - name: Upload harness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-result
          path: |
            harness_output.json
            harness_stderr.log
          if-no-files-found: ignore

  callback:
    # Only this job has access to PANTRY_CALLBACK_SIGNING_KEY via the
    # environment gate. It never executes submitted code — it just reads
    # the harness artifact and posts the signed result back to Pantry.
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pantry-callback
    steps:
      - name: Checkout runner scripts
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install callback deps
        run: pip install --no-cache-dir requests

      - name: Download harness artifact
        uses: actions/download-artifact@v4
        with:
          name: harness-result
          path: .
        continue-on-error: true

      - name: Post callback
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          SUBMISSION_ID: ${{ github.event.inputs.submission_id }}
          NONCE: ${{ github.event.inputs.nonce }}
          PANTRY_CALLBACK_SIGNING_KEY: ${{ secrets.PANTRY_CALLBACK_SIGNING_KEY }}
        run: |
          python runner/runner.py \
            --output harness_output.json \
            --stderr harness_stderr.log \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
